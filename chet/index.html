.reader-controls{display:flex;align-items:center;justify-content:space-between;gap:8px}.reader-controls p{margin:0}.reader-dialog .chip{border-color:var(--line);color:var(--muted)}.reader-dialog .full-body{margin-top:16px}
.reader-preview{margin-top:18px}.reader-preview h3{font-size:15px;margin:0 0 9px}
.reader-material{width:fit-content;max-width:100%;overflow-wrap:anywhere}.reader-material summary{display:grid;gap:4px;cursor:pointer;font-size:12px;color:var(--muted)}
.reader-file-type{display:grid;place-items:center;width:142px;max-width:100%;height:100px;border-radius:7px;background:#260909;color:var(--gold);font-size:24px}
@media(max-width:650px){.reader-dialog{width:calc(100% - 20px);max-height:calc(100% - 30px);margin:15px auto auto;padding:12px 18px 25px}}
@media(max-width:650px){#source-links{width:100%}nav button.tag-filter,nav button.add-library{width:auto;min-height:40px;padding:7px 10px;border-radius:4px;font-size:12px;gap:4px}nav button.tag-filter[aria-pressed=true]{box-shadow:inset 0 -2px var(--gold)}.result-tools{width:100%}.result-tools .search-label{min-width:0}.result-tools select{width:auto}.sidebar-foot{padding-top:0}.entry-panel .intro{margin-bottom:12px}}
  </style>
</head>
<body>
  <div id="launcher"><section id="entry-page" class="entry-layout" aria-labelledby="entry-title">
    <aside class="vault-sidebar"><a class="brand" href="#/open"><span aria-hidden="true">Z</span> Zafkiel</a><div class="sidebar-heading"><h2>最近使用的資產庫</h2></div><div class="vault-list"><a class="vault-open" href="#/home"><strong class="vault-title">我的資產庫</strong><small class="vault-path">Chet · 合成工作庫</small></a></div></aside>
    <main class="entry-main"><div class="entry-content"><form id="open-vault"><h1 id="entry-title" tabindex="-1">開啟資產庫</h1><p class="form-intro">Chet · 合成示範資料</p><div class="folder-picker"><div class="picker-heading"><h2>選擇資料夾</h2></div><label for="browse-path">目前位置</label><div class="path-row"><input id="browse-path" value="X:/Samples" readonly></div><p class="folder-status">已選取示範資料夾。</p></div><p class="selection-note">目前選取：我的資產庫</p><div class="form-actions"><button class="primary open-samples" type="submit">開啟資產庫</button></div></form></div></main>
  </section></div>
  <div id="workspace-shell" hidden>
  <header><a class="brand" href="#/home"><span aria-hidden="true">Z</span> Zafkiel</a><label class="sr-only" for="search">搜尋資產</label><input id="search" type="search" placeholder="搜尋" autocomplete="off"><a class="manage-link" href="#/open">我的資產庫</a><button id="new" type="button" aria-label="新增記事" title="新增記事">＋</button></header>
  <div class="layout">
    <aside><nav aria-label="資產導覽">
      <a id="home-link" href="#/home">首頁 <span>全部資產</span></a>
      <h2>相關 tag</h2><div id="source-links"></div>
      <button id="create-empty" class="add-library" type="button">＋ 建立空 tag</button>
      <button id="show-tags" class="add-library" type="button">所有 tag</button>
    </nav><div class="sidebar-foot"><p>合成資料 · 重新整理會重設</p></div></aside>
    <main>
      <p id="read-status" class="read-warning" role="status"></p>
      <section id="tag-directory" hidden aria-labelledby="directory-title"><p class="eyebrow">標籤目錄</p><h1 id="directory-title" tabindex="-1">所有 tag</h1><div id="directory-tags" class="chips"></div></section>
      <section id="workspace-page" aria-labelledby="view-title">
        <article id="composer" class="keep" aria-label="新增記事"><button id="open" class="capture-line" type="button" aria-controls="expanded" aria-expanded="false">寫記事…<span aria-hidden="true">▧</span></button><form id="expanded" hidden><label class="sr-only" for="note-title">標題</label><input id="note-title" placeholder="標題" maxlength="200"><label class="sr-only" for="note-body">正文</label><textarea id="note-body" placeholder="輸入記事內容…"></textarea><div id="note-tags" class="chips" aria-label="記事將加入的 tag"></div><p id="note-status" class="hint" role="status"></p><div class="note-toolbar"><button id="cancel-note" type="button">取消</button><button id="complete" type="submit">關閉</button></div></form></article>
        <div class="view-heading"><div><p class="eyebrow">多庫總覽</p><h1 id="view-title" tabindex="-1">首頁</h1></div></div>
        <div id="active-tags" class="chips" aria-label="已選 tag"></div>
        <div class="view-actions"><button id="reload" type="button">重新讀取來源</button><button id="add-to-tag" class="primary" type="button" aria-controls="tag-manager" aria-expanded="false" hidden>加入資產</button></div>
        <section id="tag-manager" class="keep" aria-labelledby="manage-heading" hidden>
          <div class="selection-row"><strong id="manage-heading">加入既有資產</strong><button id="close-manager" type="button">關閉</button></div>
          <label for="manage-tag">目標 tag </label><select id="manage-tag" class="manage-select"></select><div id="manager-rows"></div><p id="manager-status" class="tag-status" role="status"></p>
        </section>
        <p id="membership-status" class="tag-status" role="status"></p>
        <div class="results-bar"><p id="asset-count" role="status"></p><div class="result-tools"><label class="search-label" for="sort">排序<select id="sort"><option value="asc">Stage 標題 ↑</option><option value="desc">Stage 標題 ↓</option></select></label></div></div>
        <div id="assets" class="asset-grid"></div><p id="empty-results" class="empty-results" hidden></p>
        <details class="identity-note" id="scenario"><summary>模擬情境</summary><p>讓「影像檔案」暫時失聯，再用「重新讀取來源」模擬恢復。</p><button id="toggle-a" type="button">模擬「影像檔案」離線</button> <button id="reset" type="button">重設 demo</button></details>
      </section>
      <noscript>請啟用 JavaScript。</noscript>
    </main>
  </div>
  </div>
  <dialog id="new-tag-dialog" class="reader-dialog" aria-labelledby="new-tag-heading"><h2 id="new-tag-heading">建立空 tag</h2><form id="create-form"><div class="create-row"><label for="collection-name">tag 名稱</label><input id="collection-name" maxlength="36" autocomplete="off" required><button class="primary" type="submit">建立並開啟</button><button id="cancel-tag" type="button">取消</button></div><p id="name-error" role="alert"></p></form></dialog>
  <dialog id="asset-page" class="reader-dialog" aria-labelledby="reader-title">
    <div class="reader-controls"><p id="reader-context" class="eyebrow"></p><button id="close-asset" type="button" aria-label="關閉資產" title="關閉資產">×</button></div>
    <h2 id="reader-title" tabindex="-1"></h2><div class="chips" id="reader-tags"></div>
    <section id="reader-preview" class="reader-preview" aria-labelledby="reader-preview-title"><h3 id="reader-preview-title">檔案預覽（1）</h3><details id="reader-material" class="reader-material"><summary><span id="reader-file-type" class="reader-file-type" aria-hidden="true"></span><span id="reader-material-name"></span></summary><p class="hint">合成素材的登記資料。</p></details></section>
    <article id="reader-body" class="full-body"></article>
  </dialog>
  <script>
  'use strict';
  const fixtures = [
    {id:'north',body:'日出前的北堤。霧把遠處的燈和堤線隔開。',material:'北堤照片.jpg',titles:{archive:'北堤，凌晨五點',coast:'北堤晨霧'}},
    {id:'tide',body:'記錄漲退潮時間及觀察位置。',material:'潮位.txt',titles:{archive:'潮位觀測筆記'}},
    {id:'station',body:'舊測候站外牆與海側入口。',material:'測候站.jpg',titles:{archive:'舊測候站'}},
    {id:'route',body:'從漁港沿岸到防波堤的步行路線。',material:'路線圖.pdf',titles:{coast:'防波堤路線圖'}},
    {id:'sound',body:'黎明時在岸邊錄下的環境聲。',material:'環境音.wav',titles:{archive:'岸邊環境音',coast:'岸邊環境音'}},
    {id:'poster',body:'把北堤照片留在封面的版面提案。',material:'封面.pdf',titles:{picks:'展覽封面提案'}},
  ];
  const sourceTags = [
    {id:'archive',name:'影像檔案',members:['north','tide','station','sound']},
    {id:'coast',name:'海岸計畫',members:['north','route','sound']},
    {id:'picks',name:'展覽選件',members:['north','poster']},
  ];
  const $ = id => document.getElementById(id);
  const collator = new Intl.Collator('zh-Hant');
  const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let assets,tags,changes,filters,unavailable,manager,managerMode,nextTag,noteSequence,directory;
  const tagById = id => tags.find(tag=>tag.id===id);
  const hasMember = (tag,id) => changes.get(tag.id)?.get(id) ?? tag.members.includes(id);
  const memberTags = id => tags.filter(tag=>!unavailable.has(tag.id)&&hasMember(tag,id));
  const knownAssets = () => assets.filter(asset=>asset.local||memberTags(asset.id).length);
  // The fixtures contain direct title opinions in registration order. OpenUSD supplies the resolved title in a real read.
  const opinions = asset => asset.local?[{tag:{id:'work',name:'工作庫'},value:asset.title||'（空標題）'}]:sourceTags.flatMap(tag=>!unavailable.has(tag.id)&&Object.hasOwn(asset.titles,tag.id)?[{tag,value:asset.titles[tag.id]}]:[]);
  const title = asset => opinions(asset)[0]?.value ?? '';
  const displayTitle = asset => title(asset)||'來源無法讀取';

  function reset() {
    assets=[...fixtures];tags=[...sourceTags];changes=new Map();filters=new Set();unavailable=new Set();manager=null;managerMode=null;nextTag=1;noteSequence=0;directory=false;
    resetNote();
    $('search').value='';$('sort').value='asc';$('create-form').reset();$('name-error').textContent='';$('membership-status').textContent='';$('manager-status').textContent='';
    render();
  }
  function sorted(records){
    const direction=$('sort').value==='desc'?-1:1;
    return records.sort((a,b)=>{
      const aa=title(a),bb=title(b);
      if(!aa||!bb)return Number(!aa)-Number(!bb)||a.id.localeCompare(b.id);
      return direction*collator.compare(aa,bb)||a.id.localeCompare(b.id);
    });
  }
  function setRoute({focus=false}={}){
    const open=location.hash!=='#/home';
    $('launcher').hidden=!open;$('workspace-shell').hidden=open;$('workspace-page').hidden=open||directory;$('tag-directory').hidden=open||!directory;
    if(focus) $(open?'entry-title':'view-title').focus();
    render();
  }
  function renderNav(shown){
    const atHome=location.hash==='#/home'&&!directory&&!filters.size;
    if(atHome)$('home-link').setAttribute('aria-current','page');else $('home-link').removeAttribute('aria-current');
    const counts=new Map();
    for(const asset of shown)for(const tag of memberTags(asset.id))counts.set(tag.id,(counts.get(tag.id)||0)+1);
    $('source-links').innerHTML=tags.filter(tag=>counts.has(tag.id)).map(tag=>`<button class="tag-filter" type="button" data-action="filter" data-id="${tag.id}" aria-pressed="${filters.has(tag.id)}"><span class="tag-label">${esc(tag.name)}</span><span class="tag-count">${counts.get(tag.id)} 筆</span></button>`).join('');
    $('active-tags').innerHTML=[...filters].map(id=>{
      const tag=tagById(id);
      return `<button class="tag-chip" type="button" data-action="filter" data-id="${id}" aria-label="移除篩選 ${esc(tag.name)}">${esc(tag.name)}${unavailable.has(id)?'（讀取失敗）':''} ×</button>`;
    }).join('');
    $('note-tags').innerHTML=[...filters].map(id=>`<span class="chip">${esc(tagById(id).name)}</span>`).join('');
    if(directory)$('directory-tags').innerHTML=tags.map(tag=>`<button class="tag-chip" type="button" data-action="open-tag" data-id="${tag.id}" ${unavailable.has(tag.id)?'disabled':''}>${esc(tag.name)} <span>${unavailable.has(tag.id)?'讀取失敗':assets.filter(asset=>hasMember(tag,asset.id)).length}</span></button>`).join('');
    $('add-to-tag').hidden=![...filters].some(id=>!unavailable.has(id));
    $('add-to-tag').setAttribute('aria-expanded',String(managerMode==='add'));
  }
  function memberButton(tag,asset,mode) {
    const member=hasMember(tag,asset.id),blocked=unavailable.has(tag.id)||(!member&&!title(asset));
    const name=mode==='asset'?tag.name:displayTitle(asset);
    return `<div class="member-row"><span>${esc(name)}${blocked?'（暫時無法讀取）':''}</span><button type="button" data-action="member" data-mode="${mode}" data-tag="${tag.id}" data-id="${asset.id}" aria-label="${blocked?'無法管理':member?'移出':'加入'} ${esc(name)}" ${blocked?'disabled':''}>${blocked?'不可用':member?'移出':'加入'}</button></div>`;
  }
  function renderManager(){
    $('tag-manager').hidden=!managerMode;
    if(!managerMode)return;
    const tag=tagById(manager),choices=tags.filter(item=>filters.has(item.id));
    $('manage-tag').innerHTML='<option value="" disabled>請選擇一個目標 tag</option>'+choices.map(item=>`<option value="${item.id}" ${unavailable.has(item.id)?'disabled':''}>${esc(item.name)}${unavailable.has(item.id)?'（不可用）':''}</option>`).join('');
    $('manage-tag').value=manager||'';
    let content;
    if(!tag)content='<p class="hint">請先指定一個要加入資產的 tag。</p>';
    else if(unavailable.has(tag.id))content='<p class="hint">暫時無法讀取這個 tag 的成員。</p>';
    else {
      const candidates=sorted(knownAssets().filter(asset=>!hasMember(tag,asset.id)&&title(asset)));
      content='<p class="hint">選擇工作庫中的既有資產。</p>'+(candidates.map(asset=>memberButton(tag,asset,'add')).join('')||'<p class="hint">沒有可加入的資產。</p>');
    }
    $('manager-rows').innerHTML=content;
  }
  function renderCard(asset, expanded){
    const rows=opinions(asset),conflict=new Set(rows.map(item=>item.value)).size>1,tagsForAsset=memberTags(asset.id);
    return `<article class="asset-card${rows.length?'':' missing'}" data-asset-id="${asset.id}">
      <div class="card-content"><h2><button class="asset-open" type="button" data-action="open-asset" data-id="${asset.id}" aria-label="開啟 ${esc(displayTitle(asset))}">${esc(displayTitle(asset))}</button></h2><p class="card-caption">${rows.length?esc(asset.body):'已知成員，來源意見暫時無法讀取。'}</p>
      <div class="chips">${tagsForAsset.map(tag=>`<button class="tag-chip" type="button" data-action="open-tag" data-id="${tag.id}">${esc(tag.name)}</button>`).join('')}</div>
      <p class="source-badge">${tagsForAsset.length} 個 tag${rows.length&&asset.material?' · 1 個素材':''}</p>
      ${conflict?`<div class="source-opinions">${rows.map(({tag,value},i)=>`<p><strong>${esc(tag.name)}${i===0?' · 組合值':''}</strong> ${esc(value)}</p>`).join('')}</div>`:''}
      ${rows.length?`<details class="asset-reader" data-asset-detail="reader" ${expanded.has(asset.id+':reader')?'open':''}><summary>閱讀內容與素材</summary><p class="full-body">${esc(asset.body)}</p>${asset.material?`<p class="card-caption">${esc(asset.material)}（示意）</p>`:''}</details>`:''}
      ${rows.length&&!asset.local?`<div class="source-actions">${rows.map(({tag})=>`<button type="button" data-action="open-asset" data-id="${asset.id}" data-tag="${tag.id}">在「${esc(tag.name)}」開啟</button>`).join('')}</div>`:''}
      <details class="member-controls" data-asset-detail="member" ${expanded.has(asset.id+':member')?'open':''}><summary>管理資產的 tag</summary>${tags.map(tag=>memberButton(tag,asset,'asset')).join('')}<p class="tag-status" data-feedback="${asset.id}" role="status"></p></details></div></article>`;
  }
  function openAsset(asset,origin){
    const rows=opinions(asset),source=rows.find(({tag})=>tag.id===origin);
    $('reader-context').textContent=source?`${source.tag.name} · 來源資產`:'多庫總覽 · 資產內容';
    $('reader-title').textContent=source?.value||displayTitle(asset);
    $('reader-tags').innerHTML=memberTags(asset.id).map(tag=>`<span class="chip">${esc(tag.name)}</span>`).join('');
    $('reader-body').textContent=rows.length?asset.body:'目前無法讀取這筆資產的來源內容。';
    $('reader-preview').hidden=!rows.length||!asset.material;
    $('reader-material').open=false;
    $('reader-material-name').textContent=rows.length?asset.material:'';
    $('reader-file-type').textContent=rows.length?asset.material.split('.').pop().toUpperCase():'';
    $('asset-page').showModal();
    $('reader-title').focus();
  }
  function renderCards(){
    const invalid=[...filters].some(id=>unavailable.has(id)),q=$('search').value.trim().toLocaleLowerCase();
    const known=knownAssets();
    const scoped=invalid?[]:known.filter(asset=>[...filters].every(id=>hasMember(tagById(id),asset.id)));
    const shown=sorted(scoped.filter(asset=>[displayTitle(asset),asset.body,...memberTags(asset.id).map(tag=>tag.name)].join(' ').toLocaleLowerCase().includes(q)));
    const expanded=new Set([...$('assets').querySelectorAll('details[open]')].map(detail=>detail.closest('[data-asset-id]').dataset.assetId+':'+detail.dataset.assetDetail));
    $('asset-count').textContent=invalid?'篩選已暫停':`${q?`${shown.length} / `:''}${scoped.length} 筆${unavailable.size?'已知':''}資產`;
    $('assets').innerHTML=shown.map(asset=>renderCard(asset,expanded)).join('');
    $('empty-results').hidden=Boolean(shown.length);
    $('empty-results').textContent=invalid?'這組篩選包含暫時無法讀取的 tag。返回首頁可查看已知資產。':(filters.size===1&&!q?'這個 tag 目前沒有資產。可以寫記事，或加入既有資產。':'沒有符合的資產。');
    return shown;
  }
  function render(){
    const focused=document.activeElement?.dataset;
    const key=focused?.action&&[focused.action,focused.mode,focused.tag,focused.id];
    renderNav(renderCards());renderManager();
    if(location.hash==='#/home'){$('workspace-page').hidden=directory;$('tag-directory').hidden=!directory;}
    $('view-title').textContent=filters.size?[...filters].map(id=>tagById(id).name).join(' ＋ '):'首頁';
    $('read-status').textContent=unavailable.size?'影像檔案暫時無法讀取。總覽仍可查看，其成員與組合值可能不完整。':'';
    $('toggle-a').disabled=unavailable.has('archive');
    if(key)[...document.querySelectorAll('[data-action]')].find(el=>[el.dataset.action,el.dataset.mode,el.dataset.tag,el.dataset.id].every((value,i)=>value===key[i]))?.focus({preventScroll:true});
  }
  function setFilter(tag){
    if(unavailable.has(tag)&&!filters.has(tag))return;
    directory=false;
    if(filters.has(tag))filters.delete(tag);else filters.add(tag);
    $('membership-status').textContent='';
    if(managerMode==='add'){manager=null;managerMode=null;}
    if(location.hash==='#/open')location.hash='#/home';
    render();
  }
  function toggleMember(tag,asset,mode){
    if(unavailable.has(tag.id))return;
    const member=hasMember(tag,asset.id);
    if(!member&&!title(asset))return;
    $('membership-status').textContent='';
    const announce=message=>{
      const region=mode==='asset'?$('assets').querySelector(`[data-feedback="${asset.id}"]`):$('manager-status');
      (region||$('membership-status')).textContent=message;
    };
    if(member&&!asset.local&&memberTags(asset.id).length===1){announce('示範保留至少一個可讀 tag。');return;}
    if(!changes.has(tag.id))changes.set(tag.id,new Map());
    changes.get(tag.id).set(asset.id,!member);
    render();announce(`${displayTitle(asset)}已${member?'從工作環境移出':'加入'}「${tag.name}」。`);
    if(mode==='add')($('manager-rows').querySelector('button')||$('manage-tag')).focus({preventScroll:true});
  }
  document.addEventListener('click',event=>{
    const button=event.target.closest('button[data-action]');
    if(!button||button.disabled)return;
    const {action,id,tag,mode}=button.dataset;
    if(action==='filter')setFilter(id);
    if(action==='open-tag')openTag(id);
    if(action==='member')toggleMember(tagById(tag),assets.find(asset=>asset.id===id),mode);
    if(action==='open-asset')openAsset(assets.find(asset=>asset.id===id),tag);
  });
  function openTag(id){
    directory=false;filters=new Set([id]);manager=null;managerMode=null;$('search').value='';$('membership-status').textContent='';render();$('view-title').focus();
  }
  $('home-link').addEventListener('click',()=>{directory=false;filters.clear();manager=null;managerMode=null;$('membership-status').textContent='';render();});
  $('show-tags').addEventListener('click',()=>{directory=true;render();$('directory-title').focus();});
  $('create-empty').addEventListener('click',()=>{$('create-form').reset();$('name-error').textContent='';$('new-tag-dialog').showModal();$('collection-name').focus();});
  $('cancel-tag').addEventListener('click',()=>$('new-tag-dialog').close());
  function openManager(){
    managerMode='add';
    manager=filters.size===1?[...filters][0]:null;
    $('manager-status').textContent='';
    if(location.hash==='#/open')location.hash='#/home';
    setRoute();$('manage-tag').focus();
  }
  $('add-to-tag').addEventListener('click',openManager);
  $('close-manager').addEventListener('click',()=>{manager=null;managerMode=null;$('manager-status').textContent='';render();$('add-to-tag').focus();});
  $('close-asset').addEventListener('click',()=>$('asset-page').close());
  function showNote(open){if(open&&directory){directory=false;render();}$('open').hidden=open;$('open').setAttribute('aria-expanded',String(open));$('expanded').hidden=!open;if(open)$('note-title').focus();}
  function resetNote(){$('expanded').reset();$('note-status').textContent='';showNote(false);}
  $('open').addEventListener('click',()=>showNote(true));$('new').addEventListener('click',()=>showNote(true));
  $('open-vault').addEventListener('submit',event=>{event.preventDefault();location.hash='#/home';});
  $('cancel-note').addEventListener('click',()=>{resetNote();$('open').focus();});
  $('expanded').addEventListener('submit',event=>{
    event.preventDefault();const title=$('note-title').value,body=$('note-body').value;
    if(title.trim()||body.trim()){
      if([...filters].some(id=>unavailable.has(id))){$('note-status').textContent='選取的 tag 暫時無法讀取。請恢復讀取或移除該篩選後再儲存。';return;}
      const id=`note-${++noteSequence}`;
      assets.push({id,title,body,material:'',local:true});
      for(const tag of filters){if(!changes.has(tag))changes.set(tag,new Map());changes.get(tag).set(id,true);}
      const names=[...filters].map(tag=>tagById(tag).name).join('、');
      manager=null;managerMode=null;$('search').value='';render();
      $('membership-status').textContent=names?'已保存記事並加入 '+names+'。':'已儲存記事到合成工作庫。';
    }
    resetNote();$('open').focus();
  });
  $('manage-tag').addEventListener('change',event=>{manager=event.target.value;$('manager-status').textContent='';renderManager();});
  $('create-form').addEventListener('submit',event=>{
    event.preventDefault();const field=$('collection-name'),name=field.value.trim();
    const duplicate=tags.some(tag=>tag.name.toLocaleLowerCase()===name.toLocaleLowerCase());
    if(!name||duplicate){$('name-error').textContent=duplicate?'已有同名 tag。':'請輸入 tag 名稱。';field.focus();return;}
    const created={id:`new-${nextTag++}`,name,members:[]};tags.push(created);
    $('new-tag-dialog').close();openTag(created.id);
  });
  $('search').addEventListener('input',()=>{directory=false;render();});$('sort').addEventListener('change',render);
  $('toggle-a').addEventListener('click',()=>{unavailable.add('archive');render();});
  $('reload').addEventListener('click',()=>{unavailable.clear();render();});
  $('reset').addEventListener('click',reset);
  window.addEventListener('hashchange',()=>setRoute({focus:true}));
  reset();setRoute();
  </script>
</body>
</html>
