<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>資產庫 · Zayin 保存示範</title>
  <style>
    :root{color-scheme:dark;font:15px/1.55 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#fff;background:#601818;--panel:#6d1c1c;--hover:#7a2020;--line:#b76969;--muted:#dfbcbc;--gold:#d4af37;--card:#ea9999}
    *{box-sizing:border-box}body{margin:0}a{color:inherit}[hidden]{display:none!important}
    button,input,select,textarea{font:inherit;max-width:100%}
    button{min-height:42px;border:1px solid transparent;background:transparent;color:inherit;border-radius:4px;padding:7px 12px;cursor:pointer}
    button:hover{background:var(--hover)}button:disabled{opacity:.48;cursor:default}
    :focus-visible{outline:2px solid var(--gold);outline-offset:3px}
    header{min-height:64px;background:#000;display:flex;align-items:center;gap:16px;padding:9px 24px;position:sticky;top:0;z-index:2}
    .brand{font-size:21px;font-weight:700;text-decoration:none;white-space:nowrap}.brand span{font:28px Georgia,serif;color:var(--gold);margin-right:8px}
    #search{border:0;padding:9px 13px;width:min(46vw,580px);margin-right:auto}
    .badge{color:var(--muted);font-size:12px;white-space:nowrap}
    .icon-button{width:42px;border-radius:50%;color:var(--gold);font-size:25px;line-height:1}
    .layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100dvh - 64px)}
    aside{border-right:1px solid #400a0a;padding:14px 10px 18px 0;min-width:0}
    nav a,nav button{display:block;width:100%;text-align:left;padding:12px 20px;border-radius:0 26px 26px 0;text-decoration:none;font-size:14px}
    nav a[aria-current=page]{background:#8a2828}nav a:hover{background:var(--hover)}
    .side-note{margin:13px 18px;color:var(--muted);font-size:12px}
    main{min-width:0;padding:24px clamp(16px,3vw,42px) 40px}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    h1,h2,h3,p{margin:0}h1{font-size:23px}h2{font-size:18px}h3{font-size:16px}
    .subtle{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
    .keep{border:1px solid #000;border-top:3px solid #000;border-radius:5px;background:var(--panel);padding:14px 16px;margin-bottom:18px}
    .keep{max-width:600px;margin:0 auto 22px;padding:0;box-shadow:0 2px 6px #0005}
    .capture-line{cursor:pointer;color:var(--muted);padding:12px 16px}
    .keep form{padding:0 16px 12px}
    .field{min-width:0}.field label{display:block;color:var(--muted);font-size:12px;margin:6px 0 3px}
    input,select,textarea{border:1px solid #000;border-radius:3px;background:var(--card);color:#260707;padding:8px;min-height:40px}
    textarea{min-height:95px;resize:vertical}#title,#body{width:100%}#title{font-size:16px;font-weight:700}
    .controls,.toolbar{display:flex;align-items:end;gap:8px;flex-wrap:wrap}
    .toolbar{margin-top:10px;justify-content:space-between}.toolbar select{width:min(100%,230px)}
    button.primary{background:var(--gold);border-color:#000;color:#000;font-weight:700}
    button.primary:hover{background:#edc750}
    .save-receipt{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:8px 12px;border-left:3px solid var(--gold);background:#401313;overflow-wrap:anywhere}
    .save-receipt p{min-width:0}
    .save-receipt button{color:#ffe19b}
    .workspace-heading{display:flex;align-items:baseline;gap:12px;margin:0 0 10px;flex-wrap:wrap}
    #library-status:empty{display:none}
    .assets{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:13px}
    .assets li{min-width:0;background:var(--card);color:#400a0a;border-top:3px solid #000;border-radius:4px}
    .assets li.empty{background:transparent;border:0;color:var(--muted)}
    .assets button{display:block;text-align:left;width:100%;padding:13px;min-height:88px;overflow-wrap:anywhere;font-weight:700}
    .assets button:hover,.assets button:focus-visible{background:#f0acac}
    .assets span{display:block;color:#601818;font-size:12px;font-weight:400;margin-top:7px}
    summary{cursor:pointer;font-weight:650}
    th,td{border-bottom:1px solid var(--line);text-align:left;vertical-align:top;padding:8px 5px;overflow-wrap:anywhere}
    th:nth-child(1){width:28%}th:nth-child(2){width:23%}
    .layer{background:var(--hover);border:1px solid var(--line);border-radius:4px;padding:8px}
    dialog{color:#fff;background:var(--panel);border:1px solid var(--line);border-top:4px solid #000;border-radius:4px;width:min(920px,calc(100% - 24px));padding:16px 22px;overflow-wrap:anywhere}
    dialog::backdrop{background:#000a}.reader-controls{display:flex;justify-content:end}#asset-detail p{margin:9px 0}.reader-body{white-space:pre-wrap}
    @media(max-width:720px){.layout{display:block}aside{border:0;border-bottom:1px solid #400a0a;padding:5px 12px}nav{display:flex;gap:4px}nav a,nav button{width:auto;border-radius:4px;padding:8px 10px}.side-note{display:none}header{padding:8px 12px;gap:8px;flex-wrap:wrap}#search{order:3;width:100%;flex:1 0 100%}.badge{margin-left:auto}}
    /* Geometry from the rendered capture workspace at 75fd02e. */
    header{height:64px;padding:0 24px;gap:15px}
    .brand{margin-right:12px}
    #search{height:48px;width:min(700px,50vw);padding:12px 18px;border-radius:4px}
    #search::placeholder{color:#641919}
    .icon-button{color:var(--muted)}
    main{display:flex;flex-direction:column;padding:30px 36px 32px}
    .keep{width:min(100%,600px);border:1px solid var(--line);border-top:3px solid #000;margin-bottom:35px}
    .capture-line{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;list-style:none;font-weight:500}
    .capture-line::-webkit-details-marker{display:none}
    .capture-line span[aria-hidden]{font-size:16px}
    .keep[open] .capture-line{display:none}
    .keep form{padding:14px 16px 10px}
    .keep .field:not(.material-picker) label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    #title,#body{background:transparent;color:#fff;border:0;border-radius:0;padding:0}
    #title{height:37px;min-height:0;padding-bottom:12px}
    #body{display:block;min-height:106px}
    #title::placeholder,#body::placeholder{color:var(--muted);opacity:1}
    #title:focus-visible,#body:focus-visible{outline:none;box-shadow:inset 0 -1px #b76969}
    .toolbar{align-items:center;justify-content:start;gap:5px}
    .toolbar button[type=submit]{margin-left:auto;font-size:14px;font-weight:650}
    .toolbar .material-toggle{font-size:18px;min-width:42px}
    .toolbar .chosen-material{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
    .material-picker{margin-top:7px}
    .asset-count{margin:0 0 13px;font-size:12px}
    .assets{grid-template-columns:repeat(auto-fill,minmax(min(100%,235px),1fr));gap:18px}
    .assets button{min-height:121px;padding:14px 16px;display:flex;flex-direction:column;align-items:flex-start}
    .card-title{display:block;margin-left:26px;font-size:16px;color:#2a0505}
    .assets .card-excerpt{display:block;margin-top:9px;font-size:14px;line-height:1.5}
    .save-receipt{padding:3px 0 3px 10px;margin:0 0 14px;background:none}
    .save-receipt p{font-size:13px}
    .save-receipt button{min-height:34px}
    dialog{position:fixed;inset:5vh 0 auto;margin:0 auto;width:min(820px,calc(100% - 24px));min-height:200px;max-height:90dvh;overflow:auto;border-radius:10px;padding:22px 30px}
    dialog::backdrop{background:#0009;backdrop-filter:blur(1px)}
    .reader-controls button{font-size:21px}
    #asset-detail h2{font-size:24px;margin:3px 0 28px}
    nav a{display:flex;align-items:center;gap:24px;padding-left:24px}.nav-icon{font-size:20px;line-height:1;color:var(--muted)}
    @media(max-width:720px){header{height:auto;min-height:113px;padding:9px 12px}.brand{margin-right:auto;font-size:16px}#search{height:44px;width:100%;padding:10px}.layout{display:grid;grid-template-columns:72px minmax(0,1fr);min-height:calc(100dvh - 113px)}aside{border-right:1px solid #400a0a;padding:12px 3px 25px 0}nav{display:block}nav a{width:100%;justify-content:center;padding:12px 4px;border-radius:0 26px 26px 0;min-height:50px}.nav-text{display:none}main{padding:22px 14px}.keep{margin-bottom:35px}.assets{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}dialog{padding:12px 16px}}
    /* Launcher adapted from web/entry at the feature fork, with a synthetic folder. */
    .entry-layout{min-height:100dvh;display:grid;grid-template-columns:minmax(260px,310px) minmax(0,1fr)}
    .vault-sidebar{border-right:2px solid #000;background:var(--panel);padding:22px 14px}
    .vault-sidebar .brand{display:block;padding:0 12px 20px}
    .vault-sidebar h2{font-size:13px;color:var(--muted);border-top:1px solid #000;padding:14px 12px 8px}
    .vault-row{width:100%;text-align:left;font-weight:700}.vault-row small{display:block;font-weight:400;color:var(--muted)}
    .entry-main{display:grid;place-items:center;padding:40px 28px}
    #vault-form{width:min(670px,100%);border:2px solid #000;background:var(--panel);padding:28px;border-radius:3px;box-shadow:0 2px 8px #0005}
    #vault-form h1{margin:6px 0 4px}
    .folder-picker{margin:18px 0 10px;padding:10px 14px;background:var(--card);border:1px solid #000;color:#400a0a;border-radius:3px}
    .folder-picker h2{font-size:14px;margin:0 0 7px}
    .folder-picker p{font-size:12px;margin:0 0 7px}
    .folder-picker button{width:100%;text-align:left}.folder-picker button:hover,.folder-picker button[aria-pressed=true]{background:#f5b5b5;color:#400a0a}
    #vault-choice{min-height:1.6em;margin-bottom:8px}
    .reader-material{margin-top:16px;padding-top:10px;border-top:1px solid var(--line)}
    .reader-material button{border-color:var(--line)}
    @media(max-width:680px){.entry-layout{display:flex;flex-direction:column}.vault-sidebar{border:0;border-bottom:2px solid #000;padding:10px 14px 8px}.vault-sidebar .brand{padding:0 4px 6px}.entry-main{display:block;padding:26px 16px}#vault-form{padding:18px}}
  </style>
</head>
<body>
  <div id="launcher" class="entry-layout">
    <aside class="vault-sidebar" aria-label="資產庫清單">
      <a class="brand" href="#/open"><span aria-hidden="true">Z</span>Zafkiel</a>
      <h2>最近使用的資產庫</h2>
      <button id="recent-vault" class="vault-row" type="button">旅行資料<small>示範資產庫</small></button>
    </aside>
    <main class="entry-main">
      <form id="vault-form" aria-labelledby="entry-title">
        <h1 id="entry-title" tabindex="-1">開啟資產庫</h1>
        <p class="subtle">選擇資料夾以開啟示範資產庫。</p>
        <section class="folder-picker" aria-labelledby="folder-heading">
          <h2 id="folder-heading">選擇資料夾</h2>
          <p>目前位置 · 示範工作區</p>
          <button id="select-vault" type="button" aria-pressed="false">▸ 旅行資料</button>
        </section>
        <p id="vault-choice" class="subtle" role="status"></p>
        <button id="open-vault" class="primary" type="submit" disabled>開啟資產庫</button>
      </form>
    </main>
  </div>
  <div id="workspace" hidden>
  <header>
    <a href="#home" class="brand"><span aria-hidden="true">Z</span>Zafkiel</a>
    <label for="search" class="sr-only">搜尋資產</label><input id="search" type="search" placeholder="搜尋">
    <a class="badge" href="#/open">選擇資產庫</a>
    <button id="new-note" class="icon-button" type="button" aria-label="新增記事">＋</button>
  </header>
  <div class="layout">
    <aside>
      <nav aria-label="資產導覽">
        <a href="#home" aria-current="page" aria-label="首頁"><span class="nav-icon" aria-hidden="true">⌂</span><span class="nav-text">首頁</span></a>
      </nav>
      <p class="side-note">示範工作庫 · 旅行資料</p>
    </aside>
    <main id="home">
      <details id="composer" class="keep">
        <summary class="capture-line">寫記事…<span aria-hidden="true">▧</span></summary>
        <form id="register">
          <div class="field"><label for="title">標題（可留空）</label><input id="title" type="text" placeholder="標題" maxlength="2000"></div>
          <div class="field"><label for="body">記事內容</label><textarea id="body" placeholder="輸入記事內容…" maxlength="8000"></textarea></div>
          <div class="toolbar" aria-label="記事工具列">
            <button id="material-toggle" class="material-toggle" type="button" aria-label="加入素材" aria-expanded="false" aria-controls="material-picker">▧</button>
            <span id="chosen-material" class="chosen-material"></span>
            <button type="submit">關閉並保存</button>
          </div>
          <div id="material-picker" class="field material-picker" hidden>
            <label for="material">加入素材（合成）</label>
            <select id="material"><option value="">未加入素材</option><option>照片.jpg</option><option>收據.pdf</option></select>
          </div>
        </form>
      </details>
      <div id="save-receipt" class="save-receipt" hidden>
        <p id="save-message" role="status"></p>
        <button id="read-saved" type="button">開啟記事</button>
      </div>
      <h1 class="sr-only">首頁</h1><p id="asset-count" class="subtle asset-count" role="status"></p>
      <ul id="assets" class="assets"></ul>
    </main>
  </div>
  </div>
  <dialog id="reader" aria-label="資產內容">
    <div class="reader-controls"><form method="dialog"><button type="submit" aria-label="關閉資產">×</button></form></div>
    <div id="asset-detail" aria-live="polite"></div>
  </dialog>
  <script>
    // Fixtures are ordinary library records. The reader reports errors only for the content requested.
    const assets = [
      {id:'travel', title:'旅行筆記', body:'記錄海邊的路線和照片。', material:'路線圖.pdf'},
      {id:'checklist', title:'行前清單', body:'行前準備與待辦。', material:''},
      {id:'photos', title:'北堤照片', body:'日出前在北堤拍攝。', material:'北堤.jpg', materialUnavailable:true},
      {id:'audio', title:'渡口錄音', body:'', material:'', unavailable:true}
    ];
    const get = id => document.getElementById(id);
    const node = (tag, text, className) => {
      const result = document.createElement(tag);
      result.textContent = text;
      if (className) result.className = className;
      return result;
    };
    let vaultOpened = false;
    let lastSaved = null;
    let nextId = 0;

    function renderRoute() {
      const showWorkspace = vaultOpened && location.hash === '#/home';
      get('launcher').hidden = showWorkspace;
      get('workspace').hidden = !showWorkspace;
      if (showWorkspace) {
        renderLibrary();
        get('composer').querySelector('summary').focus();
      } else {
        if (get('reader').open) get('reader').close();
        get('entry-title').focus();
      }
    }

    function openVault() {
      vaultOpened = true;
      if (location.hash === '#/home') renderRoute();
      else location.hash = '#/home';
    }

    function renderLibrary() {
      const term = get('search').value.trim().toLocaleLowerCase();
      const shown = assets.filter(asset =>
        [asset.title, asset.body].some(value => value.toLocaleLowerCase().includes(term)));
      get('asset-count').textContent = '共 ' + shown.length + ' 筆資產';
      const list = get('assets');
      list.replaceChildren();
      if (!shown.length) list.append(node('li', '沒有符合的資產。', 'empty'));
      for (const asset of shown) {
        const title = asset.title || '（空標題）';
        const button = node('button', '');
        button.type = 'button';
        button.setAttribute('aria-label', '開啟 ' + title);
        button.append(node('strong', title, 'card-title'));
        if (asset.body) button.append(node('span', asset.body.slice(0,70), 'card-excerpt'));
        button.onclick = () => openAsset(asset);
        const item = node('li', '');
        item.append(button);
        list.append(item);
      }
    }

    function openAsset(asset) {
      const detail = get('asset-detail');
      detail.replaceChildren(node('h2', asset.title || '（空標題）'));
      if (asset.unavailable) {
        detail.append(node('p', '目前無法開啟這筆資產。'));
      } else {
        detail.append(node('p', asset.body, 'reader-body'));
        if (asset.material) {
          const materials = node('section', '', 'reader-material');
          const open = node('button', asset.material);
          const status = node('p', '', 'subtle');
          status.setAttribute('role', 'status');
          open.type = 'button';
          open.onclick = () => {
            status.textContent = asset.materialUnavailable
              ? '目前無法開啟這份素材。'
              : '已讀取合成素材：' + asset.material;
          };
          materials.append(node('h3', '素材'), open, status);
          detail.append(materials);
        }
      }
      get('reader').showModal();
    }

    function updateMaterial(open) {
      get('material-picker').hidden = !open;
      get('material-toggle').setAttribute('aria-expanded', String(open));
      get('chosen-material').textContent = get('material').value;
    }

    get('select-vault').onclick = () => {
      get('select-vault').setAttribute('aria-pressed', 'true');
      get('vault-choice').textContent = '已選擇：旅行資料';
      get('open-vault').disabled = false;
    };
    get('recent-vault').onclick = openVault;
    get('vault-form').onsubmit = event => {
      event.preventDefault();
      if (!get('open-vault').disabled) openVault();
    };
    window.addEventListener('hashchange', renderRoute);
    get('search').oninput = renderLibrary;
    get('new-note').onclick = () => { get('composer').open = true; };
    get('material-toggle').onclick = () => {
      const open = get('material-picker').hidden;
      updateMaterial(open);
      if (open) get('material').focus();
    };
    get('material').onchange = () => updateMaterial(true);
    get('composer').addEventListener('toggle', () => {
      if (get('composer').open) get('body').focus();
      else updateMaterial(false);
    });
    get('read-saved').onclick = () => { if (lastSaved) openAsset(lastSaved); };

    get('register').onsubmit = event => {
      event.preventDefault();
      const title = get('title').value;
      const body = get('body').value;
      const material = get('material').value;
      event.currentTarget.reset();
      get('composer').open = false;
      if (!title.trim() && !body.trim() && !material) {
        get('new-note').focus();
        return;
      }
      lastSaved = {id:'note-' + ++nextId, title, body, material};
      assets.push(lastSaved);
      get('search').value = '';
      renderLibrary();
      get('save-message').textContent = title.trim() ? '已保存「' + title + '」' : '已保存這筆記事';
      get('save-receipt').hidden = false;
      get('read-saved').focus();
    };
    renderRoute();
  </script>
</body>
</html>
